[project]
name = "pushquantum-hackathon-2026"
version = "0.1.0"
description = "Qoro x PushQuantum hackathon 2026: QOBLIB portfolio optimisation and network design with Divi"
readme = "README.md"
authors = [
    { name = "Clément Metz", email = "metz.clement@gmail.com" },
    { name = "Leith Chakroun", email = "leith.chakroun@epita.fr" },
    { name = "Ugo Col", email = "ugoteocol@gmail.com" },
    { name = "Alexandre Baconnet", email = "alexandre.baconnet@epita.fr" },
]
requires-python = ">=3.12"
dependencies = [
    "dimod>=0.12.23",
    "dwave-samplers>=1.8.0",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.4",
    "qoro-divi[jupyter,qubo-decompose]==0.16.2",
    "requests>=2.34.2",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "aqora>=0.39.0",
    "jupyter>=1.1.1",
    "marimo>=0.25.2",
    "markitdown[pdf]>=0.1.9",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hackathon"

[tool.ruff]
line-length = 100
extend-exclude = ["references"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["references"]
